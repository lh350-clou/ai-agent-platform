; pytest 配置。放在 backend/ 下，于是「pytest 的根目录」就是 backend/，
; 从任何位置执行 pytest 都读到同一份配置。
[pytest]
testpaths = tests

; 把 backend/ 加进 sys.path，测试里才能 import app.*。
; 项目的包结构是 backend/app/...，而 tests/ 不是包（没有 __init__.py），
; 所以 pytest 默认只会把 tests/unit 加进路径，import app 会失败。
pythonpath = .

; 异步测试直接写 async def 就行，不用每个都挂 @pytest.mark.asyncio。
; 要测的东西（run_agent、Trace 的异步上下文管理器）全是协程，
; 逐个加装饰器只会让测试文件多出一堆噪音。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
