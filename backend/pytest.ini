; pytest 配置。放在 backend/ 下，于是「pytest 的根目录」就是 backend/，
; 从任何位置执行 pytest 都读到同一份配置。
[pytest]
testpaths = tests

; 把 backend/ 加进 sys.path，测试里才能 import app.*。
; 项目的包结构是 backend/app/...，而 tests/ 不是包（没有 __init__.py），
; 所以 pytest 默认只会把 tests/unit 加进路径，import app 会失败。
pythonpath = .

; 异步测试直接写 async def 就行，不用每个都挂 @pytest.mark.asyncio。
; 要测的东西（run_agent、Trace 的异步上下文管理器）全是协程，
; 逐个加装饰器只会让测试文件多出一堆噪音。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

; 跳过原因必须始终打印出来（-rs）。
; 回归套件里有需要外部服务的用例，服务没起时它们会 skip —— 而「跑了 12 条、
; 跳过 5 条」如果看不到原因，跟「一切正常」在输出上没有任何区别。
addopts = -rs

; ---------------------------------------------------------------
; 标记（marker）。这里的两条轴是【互相独立】的，别混着理解：
;
;   怎么跑：unit（离线）/ integration（要真实服务）—— 决定「这台机器能不能跑」
;   为什么跑：regression（守住已有能力）—— 决定「这次改动要不要跑它」
;
; 于是四种组合都存在，例如 tests/regression/test_health.py 里既有
; 离线的 /health 契约用例（unit + regression），也有要连数据库的那条
; （integration + regression）。三条命令对应的关系是：
;
;   pytest                      全部
;   pytest -m regression        回归集（= 当前的全部，见下）
;   pytest -m "regression and unit"        回归集里不依赖外部服务的那部分
;   pytest -m "regression and not unit"    只看集成部分
;
; 为什么现在 -m regression 和直接 pytest 选中的集合一样：仓库里现有的用例
; 全都是为了守住已有能力而写的，没有一条是探索性的。标记的意义在于
; 以后新增那种「先跑跑看」的临时用例时，它可以不进回归集 ——
; 而不是让大家每次手动挑文件。
markers =
    unit: 不依赖任何外部服务（数据库 / 向量库 / API Key / 子进程），任何机器上都能跑
    integration: 需要真实外部服务（PostgreSQL / Milvus / DeepSeek / SiliconFlow / MCP 子进程）
    regression: 核心能力回归集，见 tests/regression/README.md
