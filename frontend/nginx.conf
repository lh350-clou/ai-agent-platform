# Nginx 站点配置：只负责把构建好的静态文件发出去。
#
# 刻意【不做反向代理】：前端调后端走的是浏览器直接请求
# http://localhost:8000（由 VITE_API_BASE_URL 决定），不经过 Nginx。
# 加一层代理反而会让「请求到底发到哪」变得难排查。
# 等哪天要把前后端收敛到同一个域名下，再在这里加 location /api 也不迟。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩。前端产物里 JS 有 70 多 KB，压缩后能小一大半。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带哈希的构建产物（assets/index-a1b2c3.js）内容永不改变，
    # 可以放心让浏览器长期缓存 —— 改了内容文件名也会变。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 反过来【绝不能缓存】：
    # 它里面引用的是带哈希的资源文件名，一旦被缓存住，
    # 用户会一直加载旧版本的 index.html，进而请求到已经删掉的旧资源。
    # 表现就是「部署完了但用户还是看到老页面」。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 的 history 路由回退。
    # 前端用的是浏览器 history 模式，/knowledge-bases/xxx 这样的路径在
    # 服务器上并不存在对应文件，直接访问会 404。
    # try_files 依次尝试：真实文件 -> 目录 -> 交给 index.html，
    # 由前端路由自己解析。没有这一条，用户刷新任意子页面都会白屏。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
